version: '3'
services:
  api-gateway:
    build: ./api-gateway
    ports:
      - "8000:8000"
  qr-generator:
    build: ./qr-generator
    ports:
      - "5000:5000"
  storage-service:
    build: ./storage-service
    ports:
      - "5001:5001"
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
